name: generalization
description: "Generalization across wind conditions: specialist vs generalist vs context-conditioned"
base_config: configs/default.yaml

training:
  total_timesteps: 1_000_000
  n_envs: 4

seeds: [42, 123, 456]

conditions:
  specialist_low:
    description: "Specialist trained on low wind (8 m/s)"
    overrides:
      wind:
        reference_speed: 8.0

  specialist_mid:
    description: "Specialist trained on medium wind (15 m/s)"
    overrides:
      wind:
        reference_speed: 15.0

  specialist_high:
    description: "Specialist trained on high wind (25 m/s)"
    overrides:
      wind:
        reference_speed: 25.0

  domain_randomized:
    description: "Domain-randomized generalist"
    overrides:
      randomization:
        enabled: true
        reference_speed_range: [8.0, 25.0]

  context_conditioned:
    description: "Context-conditioned with wind params in obs"
    overrides:
      randomization:
        enabled: true
        reference_speed_range: [8.0, 25.0]
      training:
        context_conditioned: true

eval_conditions:
  - wind_speed: 5.0
  - wind_speed: 10.0
  - wind_speed: 15.0
  - wind_speed: 20.0
  - wind_speed: 25.0
  - wind_speed: 30.0
